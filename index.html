<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloka — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
html { background: #06060a; }
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --black:     #06060a;
      --off-white: #f0ede8;
      --dim:       rgba(240,237,232,0.38);
      --dimmer:    rgba(240,237,232,0.18);
    }

html, body {
  width: 100%; min-height: 100vh;
  overflow: hidden;
  background: var(--black);
  color: var(--off-white);
}
html {
  background: var(--black);
}
    /* ── Grain ── */
    #grain {
      position:fixed; inset:-200%;
      width:400%; height:400%;
      z-index:1; pointer-events:none; opacity:0.038;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat:repeat; background-size:200px 200px;
      animation:grainShift 0.9s steps(1) infinite;
    }
    @keyframes grainShift {
      0%  {transform:translate(0,0);}
      20% {transform:translate(-3%,-5%);}
      40% {transform:translate(5%,3%);}
      60% {transform:translate(-5%,6%);}
      80% {transform:translate(3%,-4%);}
      100%{transform:translate(0,0);}
    }

    /* ── Background clock ── */
    #bg-clock {
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      z-index:2; pointer-events:none;
      opacity:0;
      animation:clockAppear 2.4s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
    }
    @keyframes clockAppear {
      from{opacity:0;transform:translate(-50%,-50%) scale(0.93);}
      to  {opacity:1;transform:translate(-50%,-50%) scale(1);}
    }
    #bg-clock svg {
      width:min(84vw,84vh);
      height:min(84vw,84vh);
    }
    /* ── Stage ── */
    #stage {
      position:relative; z-index:5;
      width:100%;height: 100vh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:0 24px; pointer-events:none;
      opacity:0;
      animation:stageFadeIn 1.6s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
    }
    @keyframes stageFadeIn {
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }

    /* ── Brand ── */
    .brand {
      font-family:'DM Mono',monospace;
      font-weight:300;
      font-size:clamp(10px,1.4vw,13px);
      letter-spacing:0.45em;
      text-transform:uppercase;
      color:var(--dim);
      margin-bottom:28px;
      opacity:0;
      animation:slideUp 1s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
    }

    /* ── Headline ── */
    .headline {
      font-family:'Playfair Display',serif;
      font-weight:400; font-style:italic;
      font-size:clamp(34px,7vw,92px);
      line-height:1.08; letter-spacing:-0.015em;
      text-align:center; color:var(--off-white);
      max-width:860px;
      opacity:0;
      animation:slideUp 1s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
    }
    .headline em {
      font-style:normal; font-weight:500;
      background:linear-gradient(105deg,#f0ede8 30%,#c8c2b4 60%,#f0ede8 80%);
      background-size:220% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      animation:shimmer 6s linear 2.6s infinite;
    }
    @keyframes shimmer {
      0%  {background-position:0% center;}
      100%{background-position:220% center;}
    }

    /* ── Footer ── */
    .footer-note {
      position:fixed; bottom:54px; left:50%;
      transform:translateX(-50%);
      font-family:'DM Mono',monospace; font-weight:300;
      font-size:clamp(8px,1vw,10px); letter-spacing:0.28em;
      text-transform:uppercase; color:var(--dimmer);
      white-space:nowrap; z-index:10;
      opacity:0; animation:fadeIn 1.2s ease 2.2s forwards;
    }

    @keyframes slideUp {
      from{opacity:0;transform:translateY(22px);}
      to  {opacity:1;transform:translateY(0);}
    }
    @keyframes fadeIn {
      from{opacity:0;} to{opacity:1;}
    }

    @media(max-width:600px){
      body::before,body::after{left:20px;right:20px;}
      body::before{top:22px;} body::after{bottom:22px;}
      .footer-note{bottom:38px;}
    }
  </style>
</head>
<body>

  <div id="grain" aria-hidden="true"></div>

  <!-- Background analog clock, no numbers -->
  <div id="bg-clock" aria-hidden="true">
    <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Face rings -->
      <circle cx="200" cy="200" r="196" stroke="rgba(240,237,232,0.07)" stroke-width="1"/>
      <circle cx="200" cy="200" r="180" stroke="rgba(240,237,232,0.04)" stroke-width="0.5"/>
      <!-- Tick groups built by JS -->
      <g id="hour-ticks"   stroke="rgba(240,237,232,0.45)" stroke-width="1.6" stroke-linecap="round"></g>
      <g id="minute-ticks" stroke="rgba(240,237,232,0.13)" stroke-width="0.8" stroke-linecap="round"></g>
      <!-- Hands -->
      <line id="hand-hour"   x1="200" y1="200" x2="200" y2="200" stroke="rgba(240,237,232,0.55)" stroke-width="2"   stroke-linecap="round"/>
      <line id="hand-minute" x1="200" y1="200" x2="200" y2="200" stroke="rgba(240,237,232,0.70)" stroke-width="1.3" stroke-linecap="round"/>
      <line id="hand-second" x1="200" y1="200" x2="200" y2="200" stroke="rgba(240,237,232,0.30)" stroke-width="0.7" stroke-linecap="round"/>
      <!-- Center dot -->
      <circle cx="200" cy="200" r="2.8" fill="rgba(240,237,232,0.55)"/>
    </svg>
  </div>

  <main id="stage">
    <p class="brand">Cloka</p>
    <h1 class="headline">
      rebirth<br>
      <em>takes a minute.</em>
    </h1>
  </main>

  <p class="footer-note" aria-hidden="true">Back soon &nbsp;·&nbsp; Stay curious</p>

  <script>
    const CX = 200, CY = 200, R = 180;

    /* ── Draw tick marks ── */
    const hourGroup = document.getElementById('hour-ticks');
    const minGroup  = document.getElementById('minute-ticks');

    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', (CX + Math.cos(a) * R).toFixed(2));
      line.setAttribute('y1', (CY + Math.sin(a) * R).toFixed(2));
      line.setAttribute('x2', (CX + Math.cos(a) * (R - 18)).toFixed(2));
      line.setAttribute('y2', (CY + Math.sin(a) * (R - 18)).toFixed(2));
      hourGroup.appendChild(line);
    }

    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', (CX + Math.cos(a) * R).toFixed(2));
      line.setAttribute('y1', (CY + Math.sin(a) * R).toFixed(2));
      line.setAttribute('x2', (CX + Math.cos(a) * (R - 7)).toFixed(2));
      line.setAttribute('y2', (CY + Math.sin(a) * (R - 7)).toFixed(2));
      minGroup.appendChild(line);
    }

    /* ── Animate hands with IST time ── */
    const handH = document.getElementById('hand-hour');
    const handM = document.getElementById('hand-minute');
    const handS = document.getElementById('hand-second');

    function setHand(el, deg, len, tail) {
      const rad = (deg - 90) * Math.PI / 180;
      el.setAttribute('x1', (CX - Math.cos(rad) * tail).toFixed(2));
      el.setAttribute('y1', (CY - Math.sin(rad) * tail).toFixed(2));
      el.setAttribute('x2', (CX + Math.cos(rad) * len).toFixed(2));
      el.setAttribute('y2', (CY + Math.sin(rad) * len).toFixed(2));
    }

    function tick() {
      const now = new Date();
      const ist = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const ms = ist.getMilliseconds();
      const s  = ist.getSeconds()  + ms / 1000;
      const m  = ist.getMinutes()  + s  / 60;
      const h  = (ist.getHours() % 12) + m / 60;

      setHand(handH, h * 30,  90, 18);
      setHand(handM, m * 6,  128, 22);
      setHand(handS, s * 6,  145, 30);
    }

    tick();
    setInterval(tick, 50); // ~20fps — smooth sweep hands
  </script>
</body>
</html>
